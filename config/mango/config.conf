source=./keybinds.conf
source=./rules.conf
source=./appearance.conf
source=./layoutsettings.conf
# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30
# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=30
drag_tile_to_tile=1
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0
# keyboard
repeat_rate=70
repeat_delay=400
numlock_on=0
xkb_rules_layout=gb
# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
swipe_min_threshold=1
# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=-0.4
# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle










