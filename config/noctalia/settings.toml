[notification]
background_opacity = 0.63999998569488525
border_color = "primary"
border_width = 1.5
offset_x = 18
offset_y = 15
position = "bottom_right"
scale = 1.1000000089406967

[osd]
background_opacity = 0.4999999888241291
border_width = 1.5
offset_y = 100
position = "bottom_center"
position_vertical = "bottom_center"
scale = 1.1500000096857548

[shell]
avatar_path = "/home/dummy/nixdotfiles/assets/lily.png"
corner_radius_scale = 0.15000000223517418
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
polkit_agent = true

    [shell.launcher]
    categories = false
    show_app_actions = true

        [shell.launcher.providers.emoji]
        prefix = "e"

        [shell.launcher.providers.panels]
        prefix = "p"

        [shell.launcher.providers.session]
        global = true
        prefix = "s"

        [shell.launcher.providers.wallpaper]
        prefix = "w"

    [shell.panel]
    open_near_click_control_center = true
    session_position = "top_left"
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    confirm_region = true
    show_cursor = true

    [shell.session]
    grid_columns = 5
    show_shortcuts = false

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Frappe Blue"
custom_palette = "nixwal2-sft"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"

[wallpaper]
directory = "/home/dummy/nixdotfiles/wallpapers"
fill_mode = "fit"

    [wallpaper.default]
    path = "/home/dummy/nixdotfiles/wallpapers/nixwal.png"

    [wallpaper.last]
    path = "/home/dummy/nixdotfiles/wallpapers/nixwal.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/dummy/nixdotfiles/wallpapers/nixwal.png"

[weather]
refresh_minutes = 60

[widget.battery]
color = "primary"
display_mode = "graphic"
icon_color = "primary"

[widget.clipboard]
enabled = false

[widget.clock]
capsule = true
capsule_border = "on_secondary"
capsule_border_width = 1.5
capsule_opacity = 0.57999999999999996
capsule_padding = 11
capsule_radius = 1
color = "#E7CB8B"
format = "{:%a, %b %d - %H:%M}"

[widget.cpu]
color = "primary"
glyph = "cpu-usage"
icon_color = "primary"
visualization = "none"

[widget.notifications]
color = "primary"
icon_color = "primary"

[widget.ram]
color = "primary"
glyph = "cpu-2"
icon_color = "primary"
visualization = "none"

[widget.text_2]
color = "primary"
icon_color = "primary"
interactive = false
text = "|"
type = "text"

[widget.text_3]
color = "primary"
icon_color = "primary"
text = "|"
type = "text"

[widget.volume]
color = "primary"
icon_color = "primary"

[widget.workspaces]
capsule_fill = "on_error"
focused_color = "#EDB1C2"
font_family = "JetBrainsMonoNL NFM Medium"
occupied_color = "#83A6BF"
style = "minimal"
