[audio]
enable_overdrive = true
enable_sounds = false
sound_volume = 0.48999998904764652

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.4999999888241291
    concave_edge_corners = false
    contact_shadow = true
    end = [
        "battery",
        "text_2",
        "volume",
        "text_3",
        "cpu",
        "text_2",
        "ram",
        "text_2",
        "notifications",
        "bluetooth",
        "brightness"
    ]
    margin_ends = 0
    padding = 13
    radius = 0
    start = [ "workspaces" ]
    thickness = 29
    widget_spacing = 8

[battery]
warning_threshold = 25

[control_center]
width = 750

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "media"

[location]
address = "Cologne, Germany"
latitude = 50.935000000000002
longitude = 6.9531010000000002

[lockscreen]
blur_intensity = 0.59999998658895493
edge_smoothness = 0.68999998457729816
fingerprint = false
tint_intensity = 0.19999999552965164
transition = [ "zoom" ]
transition_duration = 800

[lockscreen_widgets]
